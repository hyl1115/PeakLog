name: Supabase Keepalive

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets exist
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "ERROR: SUPABASE_URL secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "ERROR: SUPABASE_ANON_KEY secret is not set"
            exit 1
          fi
          echo "Secrets are configured"

      - name: Ping Supabase
        run: |
          response=$(curl -s -w "\n---HTTP_STATUS:%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/mountains?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1 | sed 's/---HTTP_STATUS://')
          echo "HTTP status: $status"
          echo "Response body: $body"
          if [ "$status" != "200" ]; then
            echo "Ping failed"
            exit 1
          fi
          echo "Supabase is alive"
